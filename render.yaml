# Configuración de despliegue para Render (https://render.com)
# Al conectar este repositorio como "Blueprint", Render lee este archivo
# y crea el servicio web automáticamente.
#
# Cada `git push` a la rama conectada vuelve a construir y publicar el sitio.
#
# El sitio ya no es estático: corre con `next start` porque /api/auth/* y
# /api/orders necesitan servidor para hablar con la base de datos MySQL.
# Todas las variables DB_* y DB_SSL son manuales (sync: false) porque
# dependen del proveedor de MySQL que uses (por ejemplo Aiven) y no deben
# reescribirse solas en cada sync del blueprint.
services:
  - type: web
    name: joyeria-pena
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
